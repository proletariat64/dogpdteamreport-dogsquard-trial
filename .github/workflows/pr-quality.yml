name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shell-check:
    name: Shell Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(scripts/*.sh)
          if [[ "${#scripts[@]}" -eq 0 ]]; then
            echo "No shell scripts found; skipping shell syntax check."
            exit 0
          fi
          bash -n "${scripts[@]}"

  repository-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace in changed files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1 HEAD
          else
            git diff --check
          fi

  node-quality:
    name: Node Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run local foundation commands
        shell: bash
        run: |
          set -euo pipefail
          make help
          make doc-check
          make doc-guard
          make release-check

  pr-summary:
    name: PR Quality Summary
    runs-on: ubuntu-latest
    needs:
      - shell-check
      - repository-hygiene
      - node-quality
    if: always()
    steps:
      - name: Summarize required jobs
        shell: bash
        env:
          SHELL_CHECK: ${{ needs.shell-check.result }}
          REPOSITORY_HYGIENE: ${{ needs.repository-hygiene.result }}
          NODE_QUALITY: ${{ needs.node-quality.result }}
        run: |
          set -euo pipefail
          failed=0
          for item in \
            "shell-check:$SHELL_CHECK" \
            "repository-hygiene:$REPOSITORY_HYGIENE" \
            "node-quality:$NODE_QUALITY"; do
            name="${item%%:*}"
            result="${item#*:}"
            echo "$name: $result"
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "PR Quality Summary failed because one or more required jobs did not succeed."
            exit 1
          fi

          echo "PR Quality Summary passed."
