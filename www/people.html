<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人员管理 — 部门目标管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/design-tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>
<div class="content">
  <div class="toolbar">
    <h1 class="page-title" style="border:none;padding:0;flex:1">人员管理</h1>
    <input class="form-input" id="filterName" placeholder="搜索姓名..." style="width:200px">
    <select class="form-select" id="filterTeam" style="width:160px"><option value="">全部团队</option></select>
    <select class="form-select" id="filterLocation" style="width:140px"><option value="">全部地点</option></select>
    <select class="form-select" id="filterTag" style="width:150px"><option value="">全部标签</option></select>
    <button class="btn btn-primary btn-sm" id="btnAdd">+ 添加人员</button>
    <span class="count-badge" id="peopleCount" style="font-size:13px;color:var(--muted)">共 0 个</span>
  </div>
  <div class="table-wrapper">
    <table>
      <thead><tr>
        <th class="sortable" data-sort="name">姓名 <span class="sort-arrow"></span></th>
        <th class="sortable" data-sort="employeeId">工号 <span class="sort-arrow"></span></th>
        <th class="sortable" data-sort="level">职级 <span class="sort-arrow"></span></th>
        <th class="sortable" data-sort="team">团队 <span class="sort-arrow"></span></th>
        <th class="sortable" data-sort="location">所在地 <span class="sort-arrow"></span></th>
        <th class="sortable" data-sort="manager">上级 <span class="sort-arrow"></span></th>
        <th>标签</th><th style="width:80px"></th>
      </tr></thead>
      <tbody id="peopleTable"></tbody>
    </table>
  </div>
  <div id="emptyState" class="empty-state" style="display:none">暂无人员数据</div>
</div>
<script src="/js/api.js"></script>
<script src="/js/state.js"></script>
<script src="/js/analytics.js"></script>
<script src="/js/components.js"></script>
<script src="/js/inline-editor.js"></script>
<script src="/js/people.js"></script>
</body>
</html>
